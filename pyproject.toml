[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crap-everything"
version = "0.1.0"
description = "Unified multi-language, multi-project CRAP metric abstraction layer and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2 ; python_full_version < '3.11'",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-kotlin>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
crap = "crap_everything.cli:main"
crap-everything = "crap_everything.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/crap-everything/crap4java/src/crap4java" = ["crap4java/src/crap4java/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "crap4py/src"]
