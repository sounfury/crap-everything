[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crap-everything"
version = "0.1.0"
description = "Unified multi-language, multi-project CRAP metric abstraction layer and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
crap = "crap_everything.cli:main"
crap-everything = "crap_everything.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "crap4py/src"]
